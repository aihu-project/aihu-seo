name: Release @aihu/seo 1.0.6

# This workflow is deliberately keyed to one exact tag. A maintainer must
# review and merge the hardening PR before creating v1.0.6; no other tag or
# manual dispatch can reach npm publish.
on:
  push:
    tags: ['v1.0.6']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/tags/v1.0.6' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.6.0'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.5.1
      - name: Verify exact release tag
        run: node scripts/assert-release-tag.mjs
      - name: Install and build
        run: npm ci && npm run build
      - name: Capture exactly one tarball
        id: pack
        run: |
          set -euo pipefail
          TARBALL_PATH="$(node scripts/create-tarball.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aihu-seo-pack")"
          test -f "$TARBALL_PATH"
          echo "path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"
      - name: Verify tarball identity, exports, dependencies, and files
        run: node scripts/verify-tarball.mjs '${{ steps.pack.outputs.path }}'
      - name: Verify isolated consumer
        run: node scripts/verify-consumer.mjs '${{ steps.pack.outputs.path }}'
      - name: Sanitize setup-node auth config
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc-only
        run: |
          set -euo pipefail
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN NPM_TOKEN
          node scripts/assert-oidc-contract.mjs
      - name: Confirm target version is absent with E404 only
        run: node scripts/assert-npm-absent.mjs '@aihu/seo@1.0.6'
      - name: Publish with GitHub OIDC provenance
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc-oidc-only
        run: npm publish '${{ steps.pack.outputs.path }}' --access public --provenance --registry=https://registry.npmjs.org
