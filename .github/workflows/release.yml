name: Release @aihu/seo 1.0.6

# The tag must be the reviewed merge commit on the default branch. The exact
# procedure and the limits of tag-workflow provenance are documented in
# docs/release.md. There is no manual dispatch or mutable branch input.
on:
  push:
    tags: ['v1.0.6']

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  publish:
    if: github.ref == 'refs/tags/v1.0.6' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.artifacts/npmrc-oidc-only
      NPM_CONFIG_GLOBALCONFIG: ${{ github.workspace }}/.artifacts/npmrc-global-empty
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Prepare controlled npm config
        run: node scripts/prepare-npm-config.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.6.0'
      - name: Pin npm trusted-publishing client
        run: npm install --global --ignore-scripts npm@11.5.1
      - name: Verify reviewed source and exact release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$RELEASE_DEFAULT_BRANCH:refs/remotes/origin/$RELEASE_DEFAULT_BRANCH"
          node scripts/assert-release-tag.mjs
      - name: Install dependencies without lifecycle scripts and build explicitly
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN npm_config__auth npm_config__authToken
          npm ci --ignore-scripts
          npm run build
          npm run verify:readme
      - name: Capture exactly one tarball
        id: pack
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN npm_config__auth npm_config__authToken
          TARBALL_PATH="$(node scripts/create-tarball.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aihu-seo-pack")"
          test -f "$TARBALL_PATH"
          echo "path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"
      - name: Verify tarball identity, exports, dependencies, and files
        run: node scripts/verify-tarball.mjs '${{ steps.pack.outputs.path }}'
      - name: Verify isolated consumer
        run: node scripts/verify-consumer.mjs '${{ steps.pack.outputs.path }}'
      - name: Confirm target version is absent with E404 only
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN npm_config__auth npm_config__authToken
          node scripts/assert-npm-absent.mjs '@aihu/seo@1.0.6'
      - name: Reassert npm binary, version, and OIDC-only auth immediately before publish
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN npm_config__auth npm_config__authToken
          test "$(command -v npm)" = "$(dirname "$(command -v node)")/npm" || { echo 'unexpected npm binary'; exit 1; }
          npm --version
          NPM_CLI="$(command -v npm)" node scripts/assert-oidc-contract.mjs
          npm publish '${{ steps.pack.outputs.path }}' --access public --provenance --registry=https://registry.npmjs.org
